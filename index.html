<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ar">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>TravELate — Travel, Decoded</title>
<style>
html {
  scroll-behavior: smooth;
}

/* ... (styles unchanged for brevity) ... */
</style>
<base target="_blank">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="login-box">
    <img class="login-logo"
      src="https://cdn.corenexis.com/files/c/9845724720.png"
      onerror="this.style.display='none'"
      alt="TravELate">
    <div class="login-title">TravELate</div>
    <div class="login-sub">Visitor Access — أدخل بيانات الدخول</div>
    <input class="login-field" id="loginUser" type="text" placeholder="Username" autocomplete="username">
    <input class="login-field" id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="login-btn" onclick="doLogin()">دخول</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- Theme Toggle -->
<button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل المظهر" aria-label="تبديل المظهر">🌙</button>

<!-- (rest of HTML unchanged until scripts) -->

<div id="toast" class="toast"></div>

<script>
/* ============================================================
   LOGIN
============================================================ */
const _u = btoa("banna"), _p = btoa("aboimran2026");
function doLogin(){
  let u=document.getElementById("loginUser").value.trim();
  let p=document.getElementById("loginPass").value.trim();
  if(btoa(u)===_u && btoa(p)===_p){
    localStorage.setItem("travelate-auth","1");
    document.getElementById("loginScreen").style.display="none";
  } else {
    document.getElementById("loginErr").textContent="❌ بيانات الدخول غير صحيحة";
    document.getElementById("loginPass").value="";
  }
}
/* ... (rest of JS unchanged until inlineConvert/runGemini) ... */

async function inlineConvert(){
  let key=document.getElementById("inlineGeminiKey").value.trim()||DEFAULT_GEMINI_KEY;
  if(!key){setInlineStatus("err","⚠️ أدخل API Key");return;}
  if(!inlinePasteB64){return;}
  let btn=document.getElementById("inlineBtnConvert");
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> جارٍ...';
  setInlineStatus("loading","يتم التحليل...");
  try{
    let res = await fetch(
      `/api/gemini`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              {
                text: `You are a GDS expert. Extract flight booking data from this image and convert to standard GDS format.\nRULES:\n- Output ONLY the GDS line(s), nothing else\n- GDS format: [S...` 
              },
              {
                inline_data: {
                  mime_type: inlinePasteType,
                  data: inlinePasteB64
                }
              }
            ]
          }]
        })
      }
    );
    let data=await res.json();
    if(data.error) throw new Error(data.error.message);
    let raw=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
    let lines=raw.split("\n").map(l=>l.trim()).filter(l=>l&&/^\d/.test(l)).join("\n");
    if(!lines) throw new Error("لم يُستخرج GDS");
    let ta=document.getElementById("input");
    let cur=ta.value.trim();
    ta.value=cur?cur+"\n"+lines:lines;
    autoResizeTextarea(ta);
    setInlineStatus("ok","✅ تم");
    saveToStorage();
    setTimeout(()=>{
      inlineCancelPaste();
      ta.style.borderColor="#4ade80";
      setTimeout(()=>ta.style.borderColor="",1800);
      ta.scrollIntoView({behavior:"smooth",block:"center"});
      showToast("✅ تم إدراج سطر GDS");
    },700);
  }catch(err){
    setInlineStatus("err","❌ "+err.message);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> تحويل لـ GDS';
  }
}

/* ============================================================
   GDS IMAGE CONVERTER MODAL
============================================================ */

async function runGemini(){
  let key=document.getElementById("geminiKey").value.trim()||DEFAULT_GEMINI_KEY;
  if(!key){setGDSStatus("err","⚠️ أدخل Gemini API Key أولاً");return;}
  if(!gdsB64){setGDSStatus("err","⚠️ الصق صورة أولاً");return;}
  let btn=document.getElementById("gdsBtnConvert");
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> جارٍ التحليل...';
  setGDSStatus("loading","يتم تحليل الصورة...");
  document.getElementById("gdsResultBox").style.display="none";
  document.getElementById("gdsBtnUse").style.display="none";
  try{
    let res=await fetch(
      `/api/gemini`,
      {method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[
          {text:`You are a GDS (Global Distribution System) expert. Extract flight booking data from this image and convert it to standard GDS format.\n\nRULES:\n- Output ONLY the GDS line(s), no...`},
          {inline_data:{mime_type:gdsType,data:gdsB64}}
        ]}]})}
    );
    let data=await res.json();
    if(data.error) throw new Error(data.error.message);
    let raw=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
    let lines=raw.split("\n").map(l=>l.trim()).filter(l=>l&&/^\d/.test(l)).join("\n");
    if(!lines) throw new Error("لم يُستخرج سطر GDS — تأكد من وضوح الصورة");
    gdsText=lines;
    let rb=document.getElementById("gdsResultBox");
    rb.textContent=lines; rb.style.display="block";
    let ub=document.getElementById("gdsBtnUse");
    ub.style.display="flex";
    setGDSStatus("ok","✅ تم التحويل بنجاح");
  }catch(err){
    setGDSStatus("err","❌ خطأ: "+err.message);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> تحويل';
  }
}

/* (rest of JS unchanged) */
</script>
</body>
</html>
