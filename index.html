<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="ar">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>TravELate — Travel, Decoded</title>
<style>
/* Styles unchanged (kept as in repo) */
</style>
<base target="_blank">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen"> ... </div>

<!-- Theme Toggle -->
<button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="تبديل المظهر" aria-label="تبديل المظهر">🌙</button>

<!-- Rules Modal -->
<div class="modal-overlay" id="rulesModal"> ... </div>

<!-- Airport Modal -->
<div class="modal-overlay" id="airportModal"> ... </div>

<!-- GDS Image Converter Modal -->
<div class="modal-overlay" id="gdsModal">
  <div class="gds-modal-box">
    <h3><i class="fa-solid fa-camera"></i> تحويل صورة الحجز إلى GDS</h3>
    <div class="gds-drop-zone" id="gdsDropZone">
      <div class="dz-icon">🖼️</div>
      <div class="dz-title">اسحب الصورة هنا</div>
      <div class="dz-hint">أو اضغط <kbd style="background:#1e293b;border:1px solid #334155;border-radius:4px;padding:1px 5px;font-family:monospace;font-size:11px;">Ctrl+V</kbd> للصق</div>
    </div>
    <!-- Removed geminiKey input from UI to avoid confusion; server-side proxy uses ENV secret -->
    <div class="gds-status-line" id="gdsStatusLine">الصق صورة الحجز أو اسحبها في المربع أعلاه</div>
    <div class="gds-result-box" id="gdsResultBox"></div>
    <button class="gds-btn-use" id="gdsBtnUse" onclick="useGDSResult()">
      <i class="fa-solid fa-check"></i> استخدام هذا السطر في حقل البيانات
    </button>
    <button class="gds-btn-convert" id="gdsBtnConvert" onclick="runGemini()" disabled>
      <i class="fa-solid fa-wand-magic-sparkles"></i> تحويل
    </button>
    <button class="gds-btn-cancel" onclick="closeGDSModal()">إلغاء</button>
  </div>
</div>

<!-- (rest of page unchanged: forms, fields, footer) -->
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   LOGIN, THEME, STORAGE, etc. (unchanged)
   ============================================================ */

/* ============================================================
   INLINE IMAGE PASTE INTO TEXTAREA
   ============================================================ */
let inlinePasteB64="", inlinePasteType="image/png";

document.addEventListener("DOMContentLoaded",function(){
  let ta=document.getElementById("input");
  if(ta){
    ta.addEventListener('paste',function(e){
      for(let item of e.clipboardData.items){
        if(item.type.startsWith("image/")){
          e.preventDefault();
          loadInlinePaste(item.getAsFile());
          return;
        }
      }
    });
  }
});

function loadInlinePaste(file){
  inlinePasteType=file.type;
  let r=new FileReader();
  r.onload=function(e){
    inlinePasteB64=e.target.result.split(",")[1];
    let overlay=document.getElementById("imgPasteOverlay");
    let preview=document.getElementById("imgPastePreview");
    preview.src=e.target.result;
    setInlineStatus("",");
    document.getElementById("inlineBtnConvert").disabled=false;
    overlay.classList.add("visible");
    let ta=document.getElementById("input");
    overlay.style.height=ta.offsetHeight+"px";
  };
  r.readAsDataURL(file);
}

function inlineCancelPaste(){
  document.getElementById("imgPasteOverlay").classList.remove("visible");
  document.getElementById("imgPastePreview").src="";
  inlinePasteB64=""; inlinePasteType="image/png";
  setInlineStatus("","");
}

function setInlineStatus(type,msg){
  let el=document.getElementById("inlinePasteStatus");
  if(!el) return;
  el.className="img-paste-status"+(type?" "+type:"" );
  el.textContent=msg;
}

async function inlineConvert(){
  if(!inlinePasteB64){ setInlineStatus("err","⚠️ الصق صورة أولاً"); return; }
  let btn=document.getElementById("inlineBtnConvert");
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> جارٍ...';
  setInlineStatus("loading","يتم التحليل...");
  try{
    let res = await fetch(`/api/gemini`,{
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{
          parts: [
            { text: `You are a GDS expert. Extract flight booking data from this image and convert to standard GDS format.\nRULES:\n- Output ONLY the GDS line(s), nothing else\n- GDS format: ...` },
            { inline_data: { mime_type: inlinePasteType, data: inlinePasteB64 } }
          ]
        }]
      })
    });
    let data=await res.json();
    if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
    let raw=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
    let lines=raw.split("\n").map(l=>l.trim()).filter(l=>l&&/^\d/.test(l)).join("\n");
    if(!lines) throw new Error("لم يُستخرج GDS");
    let ta=document.getElementById("input");
    let cur=ta.value.trim();
    ta.value=cur?cur+"\n"+lines:lines;
    autoResizeTextarea(ta);
    setInlineStatus("ok","✅ تم");
    saveToStorage();
    setTimeout(()=>{
      inlineCancelPaste();
      ta.style.borderColor="#4ade80";
      setTimeout(()=>ta.style.borderColor="",1800);
      ta.scrollIntoView({behavior:"smooth",block:"center"});
      showToast("✅ تم إدراج سطر GDS");
    },700);
  }catch(err){
    setInlineStatus("err","❌ "+err.message);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> تحويل لـ GDS';
  }
}

/* ============================================================
   GDS IMAGE CONVERTER MODAL
   ============================================================ */
let gdsB64="", gdsType="image/png", gdsText="";

function openGDSModal(){
  gdsB64=""; gdsType="image/png"; gdsText="";
  let dz=document.getElementById("gdsDropZone");
  dz.innerHTML='<div class="dz-icon">🖼️</div><div class="dz-title">اسحب الصورة هنا</div><div class="dz-hint">أو اضغط <kbd style="background:#1e293b;border:1px solid #334155;border-radius:4px;padding:1px 5px;font-family:monospace;font-size:11px;">Ctrl+V</kbd> للصق</div>';
  document.getElementById("gdsResultBox").style.display="none";
  document.getElementById("gdsResultBox").textContent="";
  document.getElementById("gdsBtnUse").style.display="none";
  document.getElementById("gdsBtnConvert").disabled=true;
  setGDSStatus("","الصق صورة الحجز أو اسحبها في المربع أعلاه");
  document.getElementById("gdsModal").classList.add("show");
}

function closeGDSModal(){document.getElementById("gdsModal").classList.remove("show");}

function setGDSStatus(type,msg){
  let el=document.getElementById("gdsStatusLine");
  if(!el) return;
  el.className="gds-status-line"+(type?" "+type:"" );
  el.textContent=msg;
}

document.addEventListener("paste",function(e){
  if(!document.getElementById("gdsModal")?.classList.contains("show")) return;
  for(let item of e.clipboardData.items){
    if(item.type.startsWith("image/")){
      e.preventDefault();
      loadGDSFile(item.getAsFile());
      return;
    }
  }
});

document.addEventListener("DOMContentLoaded",function(){
  let dz=document.getElementById("gdsDropZone");
  if(dz){
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag"); if(e.dataTransfer.files[0]) loadGDSFile(e.dataTransfer.files[0]);});
  }
});

function loadGDSFile(file){
  gdsType=file.type;
  let r=new FileReader();
  r.onload=e=>{
    gdsB64=e.target.result.split(",")[1];
    let dz=document.getElementById("gdsDropZone");
    dz.innerHTML=`<img src="${e.target.result}" alt="preview" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;padding:8px;">`;
    document.getElementById("gdsBtnConvert").disabled=false;
    setGDSStatus("ok","✅ صورة جاهزة — اضغط تحويل");
  };
  r.readAsDataURL(file);
}

async function runGemini(){
  if(!gdsB64){ setGDSStatus("err","⚠️ الصق صورة أولاً"); return; }
  let btn=document.getElementById("gdsBtnConvert");
  btn.disabled=true;
  btn.innerHTML='<span class="spin"></span> جارٍ التحليل...';
  setGDSStatus("loading","يتم تحليل الصورة...");
  document.getElementById("gdsResultBox").style.display="none";
  document.getElementById("gdsBtnUse").style.display="none";
  try{
    let res=await fetch(`/api/gemini`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:`You are a GDS (Global Distribution System) expert. Extract flight booking data from this image and convert it to standard GDS format.\n\nRULES:\n- Output ONLY the GDS line(s), nothing else`},{inline_data:{mime_type:gdsType,data:gdsB64}}]}]})});
    let data=await res.json();
    if(data.error) throw new Error(data.error.message||JSON.stringify(data.error));
    let raw=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("").trim();
    let lines=raw.split("\n").map(l=>l.trim()).filter(l=>l&&/^\d/.test(l)).join("\n");
    if(!lines) throw new Error("لم يُستخرج سطر GDS — تأكد من وضوح الصورة");
    gdsText=lines;
    let rb=document.getElementById("gdsResultBox");
    rb.textContent=lines; rb.style.display="block";
    let ub=document.getElementById("gdsBtnUse");
    ub.style.display="flex";
    setGDSStatus("ok","✅ تم التحويل بنجاح");
  }catch(err){
    setGDSStatus("err","❌ خطأ: "+err.message);
  }finally{
    btn.disabled=false;
    btn.innerHTML='<i class="fa-solid fa-wand-magic-sparkles"></i> تحويل';
  }
}

function useGDSResult(){
  if(!gdsText) return;
  let ta=document.getElementById("input");
  let cur=ta.value.trim();
  ta.value=cur?cur+"\n"+gdsText:gdsText;
  autoResizeTextarea(ta);
  saveToStorage();
  closeGDSModal();
  showToast("✅ تم إدراج سطر GDS في حقل البيانات");
}

/* ============================================================
   Remaining app JS (generate, saveToStorage, helpers) unchanged
   ============================================================ */
</script>
</body>
</html>
